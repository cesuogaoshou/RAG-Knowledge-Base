services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      RAG_UPLOAD_DIR: /app/data/uploads
      RAG_VECTOR_STORE_DIR: /app/data/chroma_db
      RAG_DATABASE_URL: sqlite:////app/data/app.db
      RAG_CORS_ORIGINS: http://127.0.0.1:5173,http://localhost:5173
      HF_HOME: /app/data/huggingface
      SENTENCE_TRANSFORMERS_HOME: /app/data/sentence_transformers
    ports:
      - "8000:8000"
    volumes:
      - rag_backend_data:/app/data

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://127.0.0.1:8000
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  rag_backend_data:
